services:
  - type: web
    name: astrovitals-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: NASA_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "sqlite:///./astrovitals.db"
      - key: CORS_ORIGINS
        value: "https://astrovitals.vercel.app,http://localhost:5173"
      - key: ADMIN_EMAIL
        value: "tanvirahmmed13579@gmail.com"
      - key: AUTHOR
        value: "MD Tanvir Ahmmed"

